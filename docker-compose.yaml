version: '3.8'

services:
  database:
    image: localhost:5000/resto-database:latest
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: restaurant_inventory
      MYSQL_CHARSET: utf8mb4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - resto-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: localhost:5000/resto-cache:latest
    build:
      context: ./cache
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    networks:
      - resto-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: localhost:5000/resto-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      MYSQL_HOST: database
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: restaurant_inventory
      REDIS_HOST: cache
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    networks:
      - resto-network
    depends_on:
      - database
      - cache
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: localhost:5000/resto-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - resto-network
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  proxy:
    image: localhost:5000/resto-proxy:latest
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - resto-network
    depends_on:
      - frontend
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  resto-network:
    driver: overlay
    attachable: true

volumes:
  mysql_data:
    driver: local