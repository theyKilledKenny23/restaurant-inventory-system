name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          docker-compose --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/resto-database:latest

      - name: Build and push cache
        uses: docker/build-push-action@v6
        with:
          context: ./cache
          file: ./cache/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/resto-cache:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/resto-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/resto-frontend:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/resto-proxy:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run deployment tests
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          sed -i "s|localhost:5000/resto-database:latest|${DOCKER_USERNAME}/resto-database:latest|g" docker-compose.yaml
          sed -i "s|localhost:5000/resto-cache:latest|${DOCKER_USERNAME}/resto-cache:latest|g" docker-compose.yaml
          sed -i "s|localhost:5000/resto-backend:latest|${DOCKER_USERNAME}/resto-backend:latest|g" docker-compose.yaml
          sed -i "s|localhost:5000/resto-frontend:latest|${DOCKER_USERNAME}/resto-frontend:latest|g" docker-compose.yaml
          sed -i "s|localhost:5000/resto-proxy:latest|${DOCKER_USERNAME}/resto-proxy:latest|g" docker-compose.yaml
          sed -i "s|driver: overlay|driver: bridge|g" docker-compose.yaml
          docker-compose up -d
          sleep 15
          for service in database cache backend frontend proxy; do
            if [ -z "$(docker ps -q -f name=resto-${service})" ]; then
              echo "Error: ${service} container is not running"
              docker-compose logs ${service}
              docker-compose down --volumes
              exit 1
            fi
          done
          curl -f http://localhost:80 || {
            echo "Error: Application is not accessible"
            docker-compose logs proxy
            docker-compose down --volumes
            exit 1
          }
          echo "All tests passed successfully!"
          docker-compose down --volumes